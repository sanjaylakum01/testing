<!DOCTYPE html>
<html>

<head>
    <title>Growlytics Anonymous ID</title>
</head>

<body>

    <h2>Growlytics Anonymous ID</h2>

    <p id="anonymousId">Generating...</p>

    <script>

        async function sha256(value) {
            const data = new TextEncoder().encode(value);
            const hash = await crypto.subtle.digest("SHA-256", data);
            return Array.from(new Uint8Array(hash)).map(byte => byte.toString(16).padStart(2, "0")).join("");
        }

        function getDeviceData() {
            return [
                navigator.platform || "",
                navigator.userAgentData?.platform || "",
                navigator.hardwareConcurrency || "",
                navigator.deviceMemory || "",
                navigator.maxTouchPoints || "",
                screen.width || "",
                screen.height || "",
                window.devicePixelRatio || "",
                screen.colorDepth || "",
                Intl.DateTimeFormat().resolvedOptions().timeZone || "",
                navigator.language || "",
                (navigator.languages || []).join(",")
            ].map(value =>String(value).trim().toLowerCase()).join("|");
        }

        async function generateAnonymousId() {

            const deviceData = getDeviceData();

            const anonymousId = await sha256(deviceData);
            document.getElementById("anonymousId").textContent = anonymousId;
            console.log("Device Data:", deviceData);
            console.log("Anonymous ID:", anonymousId);
        }
        generateAnonymousId();
    </script>

</body>

</html>
